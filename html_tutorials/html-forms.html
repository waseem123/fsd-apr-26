<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        <p>
            <label for="">Full Name</label>
            <input type="text" name="fullname">
        </p>

        <p>
            <label for="">Email</label>
            <input type="email" name="email">
        </p>

        <p>
            <label for="">Mobile Number</label>
            <input type="tel" name="mobilno">
        </p>

        <p>
            <label for="">Age</label>
            <input type="number" name="age">
        </p>

        <p>
            <label for="">Password</label>
            <input type="password" name="password">
        </p>
        <hr>
        <p>
            <label for="">Date of Birth</label>
            <input type="date" name="dob">
        </p>
        <p>
            <label for="">Time</label>
            <input type="time" name="time">
        </p>
        <p>
            <label for="">Date Time</label>
            <input type="datetime-local" name="datetime">
        </p>
        <hr>
        <p>
            <label for="">File</label>
            <input type="file" name="userfile">
        </p>
        <p>
            <label for="">Color</label>
            <input type="color" name="color">
        </p>
        <hr>
        <p>
            <label for="">Gender</label>
            <br>
            <label for="male">Male</label>
            <input type="radio" id="male" name="gender">

            <label for="female">Female</label>
            <input type="radio" id="female" name="gender">
        </p>

        <p>
            <label for="">City</label>
            <select name="city" id="city" multiple>
                <option value="SUR">Solapur</option>
                <option value="MUM">Mumbai</option>
                <option value="PUN">Pune</option>
                <option value="DEL">Delhi</option>
                <option value="CHN">Chennai</option>
            </select>
        </p>
        <hr>
        <p>
            <textarea name="" id="" rows="5" cols="20"></textarea>
        </p>
        <p>
            <input type="range">
        </p>

        <fieldset>
            <legend><b>Personal Information</b></legend>
            <p>
                <label for="">Full Name</label>
                <input type="text">
            </p>
            <p>
                <label for="">Email</label>
                <input type="email">
            </p>
        </fieldset>

        <fieldset>
            <legend><b>Qualification Information</b></legend>
            <p>
                <label for="">Qualification</label>
                <select name="" id="">
                    <option value="SSC">10th</option>
                    <option value="HSC">12th</option>
                    <option value="DIP">Diploma</option>
                    <option value="UG">Graduation</option>
                    <option value="PG">Post Graduation</option>
                </select>
            </p>
            <p>
                <label for="">College / University Name</label>
                <input type="text">
            </p>

            <p>
                <label for="">Passout Year</label>
                <input type="number">
            </p>
        </fieldset>
    </form>
</body>

</html>
