<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="savedata">
        <input type="text" name="fullname" placeholder="Enter your full name">
        <p>
            <label for="">Age</label>
            <input type="number" name="age" min="1" max="150">
        </p>

        <p>
            <label for="">Email</label>
            <input type="email" placeholder="e.g. alex@example.com" name="email" id="">
        </p>

        <p>
            <label for="">Mobile Number</label>
            <input type="tel" maxlength="10" minlength="10" required>
        </p>

        <p>
            <label for="">User ID</label>
            <input type="text" value="'110025'">
        </p>


        <p>
            <label for="">User ID (Read Only)</label>
            <input type="text" value="'110025'" readonly>
        </p>


        <p>
            <label for="">User ID (Disabled)</label>
            <input type="text" value="'110025'" disabled>
        </p>

        
        <p>
            <input type="hidden" value="'110025'">
        </p>
        <input type="submit">
        <input type="reset">
    </form>
</body>

</html>
