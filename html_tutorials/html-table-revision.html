<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,th,td{
            padding: 8px;
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <h1>HTML Tables</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Salary</th>
                <th>Designation</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>101</td>
                <td>Alex</td>
                <td>55000</td>
                <td>Sr. Engineer</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Alice</td>
                <td>30000</td>
                <td>Jr. Engineer</td>
            </tr>

            <tr>
                <td>103</td>
                <td>John</td>
                <td>45000</td>
                <td>Tester</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4" style="text-align: center;">Total 3 Employees</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
